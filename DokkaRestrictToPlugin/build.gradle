// A Dokka plugin (plain Kotlin/JVM library) that suppresses any declaration annotated
// with androidx.annotation.RestrictTo from generated documentation.
//
// Internal build tooling only
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    alias libs.plugins.kotlin.jvm
}

group = 'com.braintreepayments.dokka'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = '17'
}

dependencies {
    compileOnly libs.dokka.core
    compileOnly libs.dokka.base
}